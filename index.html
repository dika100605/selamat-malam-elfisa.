<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selamat Malam, Elfisa 🌙</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(to bottom,#0f172a,#1e293b,#020617);
    overflow:hidden;
}

.stars{
    position:absolute;
    width:100%;
    height:100%;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:blink 2s infinite;
}

@keyframes blink{
    50%{opacity:0.2;}
}

.card{
    width:90%;
    max-width:450px;
    padding:35px;
    text-align:center;
    color:white;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border-radius:25px;
    box-shadow:0 0 30px rgba(255,255,255,0.1);
}

.moon{
    font-size:65px;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    50%{transform:translateY(-10px);}
}

h1{
    margin-top:10px;
    margin-bottom:15px;
}

p{
    line-height:1.8;
    color:#e2e8f0;
}

button{
    margin-top:25px;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:#f472b6;
    color:white;
    cursor:pointer;
    font-size:16px;
}

#msg{
    margin-top:20px;
    color:#fde68a;
    font-weight:600;
}
</style>
</head>
<body>

<div class="stars"></div>

<div class="card">
    <div class="moon">🌙</div>

    <h1>Selamat Malam, Elfisa</h1>

    <p>
        Hari ini pasti cukup panjang dan melelahkan.<br><br>

        Jadi malam ini istirahat yang cukup ya.
        Semoga tidurnya nyenyak, mimpinya indah,
        dan besok bangun dengan senyum yang lebih manis dari biasanya. ✨
    </p>

    <button onclick="showMsg()">
        Ada Pesan Untukmu 💌
    </button>

    <div id="msg"></div>
</div>

<script>
function showMsg(){
    document.getElementById("msg").innerHTML =
    "Selamat tidur, Elfisa 🌙✨ Jangan lupa istirahat. Besok masih harus semangat kerja. Semoga harimu selalu baik dan menyenangkan.";
}

for(let i=0;i<80;i++){
    let star=document.createElement("div");
    star.className="star";
    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";
    star.style.animationDelay=Math.random()*2+"s";
    document.querySelector(".stars").appendChild(star);
}
</script>

</body>
</html>
